# LeanTimeMachine - Time Machine exclusions (fixed paths, applied with tmutil addexclusion -p)
# LeanTimeMachine - exclusions Time Machine (chemins fixes, appliquées avec tmutil addexclusion -p)
#
# EN: One path per line. '#' starts a comment. '~' and '$HOME' are expanded. Spaces are allowed without quotes.
#     No wildcards. A folder excludes its sub-folders. Paths are excluded even if they do not exist (yet).
#     Only list regenerable sub-folders (e.g. ~/.ollama/models, never ~/.ollama): parents often hold config or secrets.
#     After editing: leantimemachine apply
# FR: Un chemin par ligne. '#' = commentaire. '~' et '$HOME' sont développés. Espaces acceptés sans guillemets.
#     Pas de caractères génériques. Un dossier exclut ses sous-dossiers. Les chemins sont exclus même s'ils n'existent pas (encore).
#     Ne lister que les sous-dossiers régénérables (ex. ~/.ollama/models, jamais ~/.ollama) : le parent contient souvent config ou secrets.
#     Après modification : leantimemachine apply

